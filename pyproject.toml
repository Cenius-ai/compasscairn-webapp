# compasscairn — build metadata
#
# CompassCairn has NO third-party runtime dependencies: it is a single file
# (compasscairn.py) using the Python standard library only. This file exists so
# the tool can be installed as a real console command (`compasscairn ...`) and
# so the test tooling is declared.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compasscairn"
version = "1.0.0"
description = "Log waypoint bearing corrections, keep magnetic declination per location and flag drift past a threshold."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
compasscairn = "compasscairn:main"

[project.optional-dependencies]
test = ["pytest==8.2.2"]

[tool.setuptools]
py-modules = ["compasscairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
